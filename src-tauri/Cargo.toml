[package]
name = "tsmb-desktop"
version = "0.2.0"
description = "TeamSpeak 音乐机器人的桌面端伴侣应用：登录服务器、悬浮桌面歌词"
authors = ["TSMusicBot Contributors"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tsmb_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["macros", "sync", "time"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
thiserror = "2"
percent-encoding = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
proptest = "1"

# T6 体积优化：strip 符号 + fat LTO + 单编译单元 + 体积优先 + panic 精简。
# 代价：编译时间 35s → 数分钟；opt-level="s" 的运行时开销对本应用可忽略
#（基线 CPU 0.03%，瓶颈是 WebView2 而非 Rust 代码）。
[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"

